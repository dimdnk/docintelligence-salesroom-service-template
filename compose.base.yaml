services:
  # PostgreSQL Database for Pitch Service - Local Development
  # pgvector/pgvector image required for the vector extension used by semantic search.
  postgres-pitch:
    image: pgvector/pgvector:pg17-bookworm
    container_name: docintelligence-pitch-postgres-dev
    environment:
      POSTGRES_DB: pitchservice
      POSTGRES_USER: svc_pitch_dba
      POSTGRES_PASSWORD: svc_pitch_dba
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_pitch_data:/var/lib/postgresql/data
      - ./docker/postgres/init-pitch.sql:/docker-entrypoint-initdb.d/init-pitch.sql:ro
    networks:
      - pitch-service-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U svc_pitch_dba -d pitchservice -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c max_connections=100
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB

  # RabbitMQ for Pitch Service - Local Development
  rabbitmq-pitch:
    image: rabbitmq:3.13-management-alpine
    container_name: docintelligence-pitch-rabbitmq-dev
    environment:
      RABBITMQ_DEFAULT_USER: svc_pitch_rmq
      RABBITMQ_DEFAULT_PASS: svc_pitch_rmq
      RABBITMQ_DEFAULT_VHOST: /
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -rabbit log_levels [{connection,error},{default,info}] disk_free_limit 2147483648
    ports:
      - "5672:5672" # AMQP port
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_pitch_data:/var/lib/rabbitmq
    networks:
      - pitch-service-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # MinIO S3-compatible object storage - Local Development
  minio:
    image: pgsty/minio:latest
    container_name: docintelligence-pitch-minio-dev
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: iqkv
      MINIO_ROOT_PASSWORD: iqkv_password
      # Server-level CORS — allows presigned URL uploads from any local origin
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "9002:9000" # S3 API (host 9000/9001 are taken by SonarQube in this stack)
      - "9003:9001" # Console UI
    volumes:
      - minio_pitch_data:/data
    networks:
      - pitch-service-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # MinIO bucket init — creates the pitch-assets bucket (private, served via presigned URLs)
  minio-init:
    image: pgsty/mc:latest
    container_name: docintelligence-pitch-minio-init-dev
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - pitch-service-network
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 iqkv iqkv_password &&
        mc mb --ignore-existing local/pitch-assets &&
        echo 'Buckets ready.'
      "
    restart: on-failure

  # DbGate - Database Administration Tool
  dbgate:
    image: dbgate/dbgate:5.3.3
    container_name: docintelligence-pitch-dbgate-dev
    environment:
      WEB_ROOT: /
      LOGINS: "1"
    ports:
      - "3100:3000" # DbGate Web UI (port 3100 to avoid conflict with Grafana)
    volumes:
      - ./docker/dbgate/connections.jsonl:/root/.dbgate/connections.jsonl:ro
      - dbgate_pitch_data:/root/.dbgate
    networks:
      - pitch-service-network
    depends_on:
      postgres-pitch:
        condition: service_healthy
      rabbitmq-pitch:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Pitch Service - Local Development
  pitch-service:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: builder
    image: iqkv/docintelligence-pitch-service:local
    container_name: docintelligence-pitch-service-dev
    environment:
      # Spring Configuration
      SPRING_PROFILES_ACTIVE: local
      SPRING_APPLICATION_NAME: docintelligence-pitch-service

      # Database Configuration
      DB_HOST: postgres-pitch
      DB_PORT: 5432
      DB_NAME: pitchservice
      DB_USERNAME: svc_pitch_dba
      DB_PASSWORD: svc_pitch_dba

      # RabbitMQ Configuration
      RABBITMQ_HOST: rabbitmq-pitch
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: svc_pitch_rmq
      RABBITMQ_PASSWORD: svc_pitch_rmq

      # Object Storage Configuration (MinIO)
      OBJECTSTORAGE_ENDPOINT: http://minio:9000
      OBJECTSTORAGE_PUBLIC_ENDPOINT: http://localhost:9002
      OBJECTSTORAGE_ACCESS_KEY: iqkv
      OBJECTSTORAGE_SECRET_KEY: iqkv_password
      OBJECTSTORAGE_BUCKET_NAME: pitch-assets
      OBJECTSTORAGE_REGION: us-east-1
      OBJECTSTORAGE_SSL: "false"

      # Observability
      OTEL_SERVICE_NAME: docintelligence-pitch-service
      OTEL_RESOURCE_ATTRIBUTES: service.name=docintelligence-pitch-service,service.version=1.0.0,deployment.environment=dev

      # JVM Configuration
      JAVA_OPTS: >-
        -Xms256m
        -Xmx512m
        -XX:+UseG1GC
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
        -Djava.security.egd=file:/dev/./urandom

      # JWT / Authentication
      # Uses the classpath PEM for local dev — no IAM service dependency.
      # In K8s, JWT_JWKS_URI is injected by the Helm configmap instead.
      JWT_PUBLIC_KEY_PATH: "classpath:keys/public.pem"
      JWT_JWKS_URI: ""

      # Ollama — local LLM inference
      SPRING_AI_OLLAMA_BASE_URL: "http://ollama:11434"
      SPRING_AI_OLLAMA_CHAT_OPTIONS_MODEL: "llama3.2"
      SPRING_AI_OLLAMA_EMBEDDING_MODEL: "nomic-embed-text"
    ports:
      - "8080:8080" # Pitch Service API
      - "8081:8081" # Actuator / management
    depends_on:
      postgres-pitch:
        condition: service_healthy
      rabbitmq-pitch:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - pitch-service-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped
    volumes:
      - pitch_logs:/app/logs
      - pitch_tmp:/app/tmp
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 384M

  # Ollama — local LLM inference
  ollama:
    image: ollama/ollama:latest
    container_name: docintelligence-pitch-ollama-dev
    environment:
      OLLAMA_ORIGINS: "http://localhost:8080,http://pitch-service:8080"
      OLLAMA_KEEP_ALIVE: -1
    ports:
      - "11434:11434"
    volumes:
      - ollama_pitch_data:/root/.ollama
    networks:
      - pitch-service-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # SonarQube for code quality analysis
  sonar:
    image: sonarqube:25.3.0.104237-community
    container_name: docintelligence-pitch-sonarqube-dev
    environment:
      - SONAR_FORCEAUTHENTICATION=false
    ports:
      - "127.0.0.1:9001:9000"
      - "127.0.0.1:9000:9000"
    networks:
      - pitch-service-network
    restart: unless-stopped

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: docintelligence-pitch-prometheus-dev
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - pitch-service-network
    restart: unless-stopped

  # Grafana for metrics visualization
  grafana:
    image: grafana/grafana:latest
    container_name: docintelligence-pitch-grafana-dev
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - pitch-service-network
    restart: unless-stopped

networks:
  pitch-service-network:
    driver: bridge
    name: docintelligence-pitch-service-network-dev
    ipam:
      config:
        # Pick a unique /16 block for each new service to avoid subnet conflicts.
        # Assigned ranges across foundation services:
        #   172.20.0.0/16  — reserved for this layout template / new services
        #   172.21.0.0/16  — foundation-iam-service
        #   172.22.0.0/16  — foundation-billing-service
        #   172.23.0.0/16  — foundation-gateway-service
        #   172.24.0.0/16  — foundation-cms-service
        #   172.25.0.0/16  — foundation-audit-service
        #   172.26.0.0/16  — docintelligence-pitch-service
        #   172.27.0.0/16  — next available
        - subnet: 172.26.0.0/16

volumes:
  postgres_pitch_data:
    name: docintelligence_pitch_postgres_data_dev
    driver: local
  rabbitmq_pitch_data:
    name: docintelligence_pitch_rabbitmq_data_dev
    driver: local
  minio_pitch_data:
    name: docintelligence_pitch_minio_data_dev
    driver: local
  dbgate_pitch_data:
    name: docintelligence_pitch_dbgate_data_dev
    driver: local
  pitch_logs:
    name: docintelligence_pitch_logs_dev
    driver: local
  pitch_tmp:
    name: docintelligence_pitch_tmp_dev
    driver: local
  ollama_pitch_data:
    name: docintelligence_pitch_ollama_data_dev
    driver: local
