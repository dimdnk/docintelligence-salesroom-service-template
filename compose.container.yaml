services:
  # PostgreSQL Database for Digital Sales Room
  postgres-salesroom:
    extends:
      file: compose.base.yaml
      service: postgres-salesroom

  # RabbitMQ for Digital Sales Room
  rabbitmq-salesroom:
    extends:
      file: compose.base.yaml
      service: rabbitmq-salesroom

  # MinIO S3-compatible object storage
  minio:
    extends:
      file: compose.base.yaml
      service: minio

  # MinIO bucket init
  minio-init:
    extends:
      file: compose.base.yaml
      service: minio-init

  # DbGate - Database Administration Tool
  dbgate:
    extends:
      file: compose.base.yaml
      service: dbgate

  # Ollama — local LLM inference
  ollama:
    extends:
      file: compose.base.yaml
      service: ollama

  # Digital Sales Room - Full platform run including build phase
  salesroom-service:
    extends:
      file: compose.base.yaml
      service: salesroom-service

networks:
  salesroom-service-network:
    name: docintelligence-salesroom-network-dev
    external: false

volumes:
  postgres_salesroom_data:
    name: docintelligence_salesroom_postgres_data_dev
  rabbitmq_salesroom_data:
    name: docintelligence_salesroom_rabbitmq_data_dev
  minio_salesroom_data:
    name: docintelligence_salesroom_minio_data_dev
  dbgate_salesroom_data:
    name: docintelligence_salesroom_dbgate_data_dev
  salesroom_logs:
    name: docintelligence_salesroom_logs_dev
  salesroom_tmp:
    name: docintelligence_salesroom_tmp_dev
  ollama_salesroom_data:
    name: docintelligence_salesroom_ollama_data_dev
