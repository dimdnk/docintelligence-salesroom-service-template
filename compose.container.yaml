services:
  # PostgreSQL Database for Pitch Service
  postgres-pitch:
    extends:
      file: compose.base.yaml
      service: postgres-pitch

  # RabbitMQ for Pitch Service
  rabbitmq-pitch:
    extends:
      file: compose.base.yaml
      service: rabbitmq-pitch

  # MinIO S3-compatible object storage
  minio:
    extends:
      file: compose.base.yaml
      service: minio

  # MinIO bucket init
  minio-init:
    extends:
      file: compose.base.yaml
      service: minio-init

  # DbGate - Database Administration Tool
  dbgate:
    extends:
      file: compose.base.yaml
      service: dbgate

  # Ollama — local LLM inference
  ollama:
    extends:
      file: compose.base.yaml
      service: ollama

  # Pitch Service - Full platform run including build phase
  pitch-service:
    extends:
      file: compose.base.yaml
      service: pitch-service

networks:
  pitch-service-network:
    name: docintelligence-pitch-network-dev
    external: false

volumes:
  postgres_pitch_data:
    name: docintelligence_pitch_postgres_data_dev
  rabbitmq_pitch_data:
    name: docintelligence_pitch_rabbitmq_data_dev
  minio_pitch_data:
    name: docintelligence_pitch_minio_data_dev
  dbgate_pitch_data:
    name: docintelligence_pitch_dbgate_data_dev
  pitch_logs:
    name: docintelligence_pitch_logs_dev
  pitch_tmp:
    name: docintelligence_pitch_tmp_dev
  ollama_pitch_data:
    name: docintelligence_pitch_ollama_data_dev
